[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arrctl"
version = "0.1.8"
description = "Declarative configuration for Sonarr, Radarr, Lidarr, Whisparr, Prowlarr and Bazarr"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luca Cirillo" }]
keywords = [
  "sonarr",
  "radarr",
  "lidarr",
  "whisparr",
  "prowlarr",
  "bazarr",
  "servarr",
  "homelab",
  "configuration-management",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "ruamel.yaml>=0.18",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
arrctl = "arrctl.cli:app"

[project.urls]
Homepage = "https://github.com/xLinkOut/arrctl"
Repository = "https://github.com/xLinkOut/arrctl"
Issues = "https://github.com/xLinkOut/arrctl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arrctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Typer's standard option style

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
